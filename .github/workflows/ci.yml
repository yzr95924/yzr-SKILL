# my_SKILL CI —— 全 skill 自校验。
#
# ┌─ 单向依赖不变量（核心原则，任何改动不得违反）──────────────────────────┐
# │ 本 workflow 只跑 my_SKILL 自家的脚本，**绝不调用 llmw CLI、不读 CLI 仓**。 │
# │ 任何想加 `llmw init` / 读 llm_workspace_cli 一步的改动都违反             │
# │ 「CLI 单向依赖 SKILL」的核心原则——拒绝合并。                              │
# └──────────────────────────────────────────────────────────────────────────┘
#
# 作用域：本仓全部 skill（yzr-*/）。原「探测器自校验」职责（两 llm-*-management
# skill 的 check_*_fixtures.py）已随这两 skill 迁往 llm_workspace_cli 仓
# （2026-08-18，斩断历史），本 CI 不再覆盖——它们由 CLI 仓 fixtures-smoke 守护。
#
# 检查项走 yzr-skill-management 的 skeleton.py check（形状比对 + 引用名 / 锚点存活）。
# skill 显式列出当前达标的三项：全仓查会 FAIL 的只剩 sys-design-doc（迁移债已记录），
# 迁完并入清单、恢复"新增 skill 不改 CI"；冒烟按 glob 循环，新增冒烟不必改本文件。

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  skill-self-check:
    name: skill self-check (all skills, zero CLI dependency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 脚本最低支持 3.7（见 pyproject.toml target-version）；ruff 已在 lint
          # 期强制 py37 语法兼容，CI 运行时用 3.11（稳定、setup-python 长期支持）。
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install markdownlint
        run: npm install -g markdownlint-cli
      - name: skeleton check (shape + ref/anchor liveness, compliant skills)
        run: python yzr-skill-management/tools/skeleton.py check yzr-skill-management yzr-md-to-html yzr-coding-style
      - name: markdownlint repo-level docs (README / AGENTS / MEMORY)
        run: markdownlint 'README.md' 'AGENTS.md' 'CLAUDE.md' 'MEMORY/**/*.md'
      - name: smoke tests
        # glob 循环，两代目录约定各一个：tests/（存量）与 tools/tests/（现行，见 AGENTS.md）。
        # 冒烟在各自 skill 目录下运行（cwd 约定见各文件头注）。
        # nullglob：某代目录约定无匹配时跳过循环；否则 bash 把字面量传进循环，cd 失败误杀 job。
        run: |
          shopt -s nullglob
          for t in */tests/smoke_test_*.py; do
            d=${t%/tests/*}
            (cd "$d" && python "tests/$(basename "$t")") || exit 1
          done
          for t in */tools/tests/smoke_test_*.py; do
            d=${t%/tools/tests/*}
            (cd "$d" && python "tools/tests/$(basename "$t")") || exit 1
          done
