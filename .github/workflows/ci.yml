# my_SKILL CI —— 全 skill 自校验。
#
# ┌─ 单向依赖不变量（核心原则，任何改动不得违反）──────────────────────────┐
# │ 本 workflow 只跑 my_SKILL 自家的脚本，**绝不调用 llmw CLI、不读 CLI 仓**。 │
# │ 任何想加 `llmw init` / 读 llm_workspace_cli 一步的改动都违反             │
# │ 「CLI 单向依赖 SKILL」的核心原则——拒绝合并。                              │
# └──────────────────────────────────────────────────────────────────────────┘
#
# 作用域：本仓全部 skill（yzr-*/）。原「探测器自校验」职责（两 llm-*-management
# skill 的 check_*_fixtures.py）已随这两 skill 迁往 llm_workspace_cli 仓
# （2026-08-18，斩断历史），本 CI 不再覆盖——它们由 CLI 仓 fixtures-smoke 守护。
#
# 检查项全部走 yzr-skill-creator 的 verify.py（frontmatter / 正文结构 / 引用存活 /
# 启发式扫描 / evals 契约 / markdownlint / ruff）——脚本自己枚举 skill，本文件不再
# 手工列目录：新增 skill 不需要改 CI。脚本改动另有一组打桩冒烟（判定向导逻辑，
# 静态检查证明不了它算得对）。

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  skill-self-check:
    name: skill self-check (all skills, zero CLI dependency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 脚本最低支持 3.7（见 pyproject.toml target-version）；ruff 已在 lint
          # 期强制 py37 语法兼容，CI 运行时用 3.11（稳定、setup-python 长期支持）。
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install ruff + pyyaml + markdownlint
        # pyyaml：quick_validate.py import yaml（唯一非 stdlib 依赖）。
        # markdownlint-cli：verify.py 的 markdown 步骤，缺了会 SKIP——这里显式装，
        # 并用 --strict-tools 让"该跑的工具没跑起来"变成失败而不是静默跳过。
        run: |
          python -m pip install ruff pyyaml
          npm install -g markdownlint-cli
      - name: verify every skill (structure + anchors + heuristics + md/py lint)
        run: python yzr-skill-creator/tools/verify.py --repo-root . --strict-tools
      - name: markdownlint repo-level docs (README / AGENTS / MEMORY)
        run: markdownlint 'README.md' 'AGENTS.md' 'CLAUDE.md' 'MEMORY/**/*.md'
      - name: scoring / schema / rule smoke tests
        # glob 循环：新增冒烟不必改本文件（与 verify.py「新增 skill 不必改 CI」同一理念）。
        # 递归全部 skill：冒烟在各自 skill 目录下运行（cwd 约定见各文件头注）。
        run: |
          for t in */tests/smoke_test_*.py; do
            d=${t%/tests/*}
            (cd "$d" && python "tests/$(basename "$t")") || exit 1
          done
