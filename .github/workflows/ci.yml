# my_SKILL CI —— 全 skill 自校验（quick_validate frontmatter + ruff）。
#
# ┌─ 单向依赖不变量（核心原则，任何改动不得违反）──────────────────────────┐
# │ 本 workflow 只跑 my_SKILL 自家的脚本，**绝不调用 llmw CLI、不读 CLI 仓**。 │
# │ 任何想加 `llmw init` / 读 llm_workspace_cli 一步的改动都违反             │
# │ 「CLI 单向依赖 SKILL」的核心原则——拒绝合并。                              │
# └──────────────────────────────────────────────────────────────────────────┘
#
# 作用域：本仓全部 skill（yzr-*/）。原「探测器自校验」职责（两 llm-*-management
# skill 的 check_*_fixtures.py）已随这两 skill 迁往 llm_workspace_cli 仓
# （2026-08-18，斩断历史），本 CI 不再覆盖——它们由 CLI 仓 fixtures-smoke 守护。
# 本仓 CI 收敛为通用的 skill 健康门：quick_validate + ruff。

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  skill-self-check:
    name: skill self-check (all skills, zero CLI dependency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 脚本最低支持 3.7（见 pyproject.toml target-version）；ruff 已在 lint
          # 期强制 py37 语法兼容，CI 运行时用 3.11（稳定、setup-python 长期支持）。
          python-version: "3.11"
      - name: install ruff + pyyaml
        # pyyaml：quick_validate.py import yaml（唯一非 stdlib 依赖）。
        # 本地 dry-run 易因系统 Python 预装 pyyaml 漏掉——CI runner 是干净的，必须显式装。
        run: python -m pip install ruff pyyaml
      - name: ruff check (py37 syntax + style, all skills with scripts/)
        run: ruff check yzr-md-to-html/scripts yzr-multi-agent-context/scripts yzr-skill-creator/scripts
      - name: ruff format --check (all skills with scripts/)
        run: ruff format --check yzr-md-to-html/scripts yzr-multi-agent-context/scripts yzr-skill-creator/scripts
      - name: quick_validate (all skills)
        run: |
          python yzr-skill-creator/scripts/quick_validate.py yzr-coding-review
          python yzr-skill-creator/scripts/quick_validate.py yzr-md-to-html
          python yzr-skill-creator/scripts/quick_validate.py yzr-multi-agent-context
          python yzr-skill-creator/scripts/quick_validate.py yzr-outline-wiki
          python yzr-skill-creator/scripts/quick_validate.py yzr-skill-creator
          python yzr-skill-creator/scripts/quick_validate.py yzr-sys-design-doc
          python yzr-skill-creator/scripts/quick_validate.py yzr-writing-review